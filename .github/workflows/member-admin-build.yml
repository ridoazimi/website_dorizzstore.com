name: Member Admin Build Check
on:
  push:
    branches: [member-redesign-20260819]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
    defaults:
      run:
        working-directory: capcut-pro-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: capcut-pro-dashboard/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
