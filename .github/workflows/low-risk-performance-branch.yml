name: Low Risk Performance Branch CI

on:
  push:
    branches:
      - agent/dorizzstore-low-risk-performance
    paths:
      - .perf-low-risk-trigger
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.head_ref == 'agent/dorizzstore-low-risk-performance' || github.ref_name == 'agent/dorizzstore-low-risk-performance'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/dorizzstore-low-risk-performance
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: capcut-pro-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: capcut-pro-dashboard
        run: npm ci

      - name: Capture baseline lint on touched existing files
        working-directory: capcut-pro-dashboard
        run: |
          npx eslint --format json \
            src/components/Sidebar.tsx \
            src/app/transactions/page.tsx \
            src/app/users/page.tsx \
            src/app/stock/page.tsx \
            src/app/dashboard/warranty/page.tsx \
            src/app/sales/page.tsx \
            > /tmp/lint-before.json || true

      - name: Apply low-risk patch when needed
        run: |
          if [ "$(git log -1 --pretty=%s)" = "optimize low-risk admin navigation performance" ]; then
            echo "Application patch already applied; validating current branch state."
          else
            python3 .github/scripts/apply-low-risk-performance.py
          fi

      - name: Verify no new lint errors from patch
        working-directory: capcut-pro-dashboard
        run: |
          npx eslint --format json \
            src/components/Sidebar.tsx \
            src/app/transactions/page.tsx \
            src/app/users/page.tsx \
            src/app/stock/page.tsx \
            src/app/dashboard/warranty/page.tsx \
            src/app/sales/page.tsx \
            src/hooks/useDebouncedValue.ts \
            src/app/api/warranty/pending-count/route.ts \
            > /tmp/lint-after.json || true
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          root = Path.cwd()
          before = json.loads(Path('/tmp/lint-before.json').read_text())
          after = json.loads(Path('/tmp/lint-after.json').read_text())

          def counter(rows):
              c = Counter()
              for row in rows:
                  rel = str(Path(row['filePath']).resolve().relative_to(root.resolve()))
                  for m in row.get('messages', []):
                      if m.get('severity') == 2:
                          c[(rel, m.get('ruleId'))] += 1
              return c

          b = counter(before)
          a = counter(after)
          introduced = a - b
          if introduced:
              print('New lint errors introduced by patch:')
              for key, count in introduced.items():
                  print(count, key)
              raise SystemExit(1)
          print('No new lint errors introduced by low-risk patch.')
          PY

      - name: Build
        working-directory: capcut-pro-dashboard
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
          JWT_SECRET: branch-build-only-secret
        run: npm run build

      - name: Verify scope
        run: |
          git status --short
          python3 - <<'PY'
          import subprocess
          allowed = {
              'capcut-pro-dashboard/src/hooks/useDebouncedValue.ts',
              'capcut-pro-dashboard/src/app/api/warranty/pending-count/route.ts',
              'capcut-pro-dashboard/src/components/Sidebar.tsx',
              'capcut-pro-dashboard/src/app/transactions/page.tsx',
              'capcut-pro-dashboard/src/app/users/page.tsx',
              'capcut-pro-dashboard/src/app/stock/page.tsx',
              'capcut-pro-dashboard/src/app/dashboard/warranty/page.tsx',
              'capcut-pro-dashboard/src/app/sales/page.tsx',
          }
          changed = set(subprocess.check_output(['git','status','--porcelain'], text=True).splitlines())
          paths = {line[3:] for line in changed if line.strip()}
          unexpected = paths - allowed
          if unexpected:
              raise SystemExit(f'Unexpected changed files: {sorted(unexpected)}')
          print('scope verification passed:', sorted(paths))
          PY

      - name: Commit validated application changes
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard capcut-pro-dashboard)" ]; then
            echo "No application changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            capcut-pro-dashboard/src/hooks/useDebouncedValue.ts \
            capcut-pro-dashboard/src/app/api/warranty/pending-count/route.ts \
            capcut-pro-dashboard/src/components/Sidebar.tsx \
            capcut-pro-dashboard/src/app/transactions/page.tsx \
            capcut-pro-dashboard/src/app/users/page.tsx \
            capcut-pro-dashboard/src/app/stock/page.tsx \
            capcut-pro-dashboard/src/app/dashboard/warranty/page.tsx \
            capcut-pro-dashboard/src/app/sales/page.tsx
          git commit -m "optimize low-risk admin navigation performance"
          git push origin HEAD:agent/dorizzstore-low-risk-performance
