name: Admin Visual Redesign CI

on:
  push:
    branches:
      - audit/admin-visual-redesign-20260817
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capcut-pro-dashboard
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: capcut-pro-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint changed visual files
        run: npx eslint src/app/layout.tsx src/components/LayoutWrapper.tsx

      - name: Type check
        run: npx tsc --noEmit

      - name: Build affected admin route
        run: npx next build --debug-build-paths='src/app/dashboard/products/page.tsx'
