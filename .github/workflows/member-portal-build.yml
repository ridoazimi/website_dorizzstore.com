name: Member Portal Build Check

on:
  push:
    branches: [member-redesign-20260819]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capcut-pro-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: capcut-pro-dashboard/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
