name: Member Branch CI
on:
  push:
    branches: [agent/member-migration-20260818]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capcut-pro-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --package-lock-only --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: synchronized-package-lock
          path: capcut-pro-dashboard/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
